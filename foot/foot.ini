# =============================================
#  Foot Terminal — Catppuccin Mocha Theme
#  https://github.com/catppuccin/foot
# =============================================

[main]
font=JetBrainsMono Nerd Font:size=8
font-size-adjustment=1
dpi-aware=yes
pad=16x16
term=xterm-256color
initial-window-size-chars=110x30

[scrollback]
lines=100000

[cursor]
style=beam
blink=yes


[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[desktop-notifications]
command=notify-send

[bell]
visual=yes

# =============================================
#  Catppuccin Mocha Color Palette
# =============================================

[colors-dark]
# Base (background layers)
background=1e1e2e
foreground=cdd6f4

# Regular colors
regular0=45475a   # Surface 1 (Black)
regular1=f38ba8   # Red
regular2=a6e3a1   # Green
regular3=f9e2af   # Yellow
regular4=89b4fa   # Blue
regular5=cba6f7   # Mauve (Magenta)
regular6=89dceb   # Sky (Cyan)
regular7=bac2de   # Subtext 1 (White)

# Bright colors
bright0=585b70    # Surface 2 (Bright Black)
bright1=f38ba8    # Red
bright2=a6e3a1    # Green
bright3=f9e2af    # Yellow
bright4=89b4fa    # Blue
bright5=cba6f7    # Mauve (Magenta)
bright6=89dceb    # Sky (Cyan)
bright7=a6adc8    # Overlay 2 (Bright White)

# Selection
selection-foreground=cdd6f4
selection-background=414559

# Alpha (transparency — 0.0 opaque to 1.0 transparent)
alpha=0.95
